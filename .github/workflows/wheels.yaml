name: Build Distributions

on:
  pull_request:
    branches: [ main ]
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - source/**
      - .github/workflows/wheels.yaml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
      version:
        description: "Version stamped on the distributions (overrides setuptools-scm)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14
          - name: windows-amd64
            os: windows-latest
    steps:
      # pyhwm2014/data is a symlink to ../data; without this Git for Windows
      # checks it out as a plain text file and the data files go missing.
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check data symlink
        shell: bash
        run: test -f pyhwm2014/data/hwm123114.bin

      - name: Pin release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      # Homebrew's libgfortran only targets the runner's own macOS release;
      # conda-forge's targets 11.0, which is what lets the wheels (which bundle
      # it) install on macOS 11+.
      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gfortran
          # conda-forge's assembler (cctools as) needs a clang to drive.
          create-args: -c conda-forge gfortran clang
          init-shell: none

      - name: Point the build at conda-forge gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="${MAMBA_ROOT_PREFIX}/envs/gfortran"
          sdk="$(xcrun --show-sdk-path)"
          "${prefix}/bin/gfortran" --version
          "${prefix}/bin/clang" --version
          {
            echo "FC=${prefix}/bin/gfortran"
            # cctools as otherwise looks for a versioned clang (clang-NN) on
            # PATH, and the env isn't activated.
            echo "CCTOOLS_CLANG_AS_EXECUTABLE=${prefix}/bin/clang"
            echo "SDKROOT=${sdk}"
            # The runtime libraries are @rpath-linked, so delocate needs an
            # rpath to find and bundle them.
            echo "LDFLAGS=-isysroot ${sdk} -Wl,-rpath,${prefix}/lib"
          } >> "${GITHUB_ENV}"

      - name: Install MinGW-w64 gfortran (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Put MinGW-w64 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:MSYS2_LOCATION\ucrt64\bin"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: wheelhouse

      - name: Check every binary supports macOS 11 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bad=0
          for whl in wheelhouse/*.whl; do
            case "${whl}" in
              *-macosx_11_0_*.whl) ;;
              *) echo "::error::${whl} is not tagged macosx_11_0"; bad=1 ;;
            esac
            dir="$(mktemp -d)"
            unzip -q "${whl}" -d "${dir}"
            while IFS= read -r -d '' bin; do
              minos="$(otool -l "${bin}" | awk '/cmd LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit} /cmd LC_VERSION_MIN_MACOSX/ {v=1} v && $1 == "version" {print $2; exit}')"
              echo "${minos} ${bin#"${dir}"/}"
              if [ -z "${minos}" ] || [ "$(printf '%s\n' "${minos}" 11.0 | sort -V | tail -n1)" != "11.0" ]; then
                echo "::error::$(basename "${whl}"): ${bin#"${dir}"/} requires macOS ${minos:-unknown}"
                bad=1
              fi
            done < <(find "${dir}" \( -name '*.so' -o -name '*.dylib' \) -print0)
          done
          exit "${bad}"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Pin release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Check the sdist builds a wheel
        run: uv build --wheel --out-dir /tmp/sdist-wheel dist/*.tar.gz

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
